<nav class="navbar navbar-dark bg-success">
  <div class="container">
    <span class="navbar-brand">🍎 Tienda de Barrio</span>
    <div class="d-flex align-items-center gap-2">
      @if (auth.estaLogueado()) {
        @if (auth.getRole() === 'ADMIN') {
          <a class="btn btn-light btn-sm" routerLink="/admin">Inventario</a>
        } @else {
          <a class="btn btn-light btn-sm" routerLink="/tienda">Tienda</a>
        }
        <span class="text-white small">{{ auth.getUsername() }} ({{ auth.getRole() }})</span>
        <button class="btn btn-outline-light btn-sm" (click)="salir()">Salir</button>
      } @else {
        <a class="btn btn-light btn-sm" routerLink="/login">Login</a>
      }
    </div>
  </div>
</nav>
