<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="text-center mb-3">Iniciar sesión</h3>
        <label class="form-label" for="usuario">Usuario</label>
        <input id="usuario" type="text" class="form-control mb-2" [(ngModel)]="username" placeholder="admin o user">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-group mb-3">
          <input id="password" [type]="mostrarPassword ? 'text' : 'password'" class="form-control"
                 [(ngModel)]="password" (keyup.enter)="ingresar()">
          <button class="btn btn-outline-secondary" type="button" (click)="mostrarPassword = !mostrarPassword">
            {{ mostrarPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <button class="btn btn-success w-100" (click)="ingresar()">Ingresar</button>
        @if (mensaje) {
          <div class="alert alert-danger mt-3 mb-0">{{ mensaje }}</div>
        }
        <p class="text-muted small mt-3 mb-0">Admin: admin / 1234567890 &nbsp;|&nbsp; Cliente: user / user123</p>
      </div>
    </div>
  </div>
</div>
