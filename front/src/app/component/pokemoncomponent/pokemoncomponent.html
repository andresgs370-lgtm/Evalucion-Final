<section class="hero-plantilla">
  <div class="container">
    <h1 class="display-4">Busqueda de Pokemones </h1>
    <p class="lead">Ingresa el nombre de el pokemon y obten sus caracteristicas.</p>
    <img src="https://logos-world.net/wp-content/uploads/2020/05/Pokemon-Symbol.jpg" style="width: 600px; height: 300px"
         alt="iamgen puchamon">
  </div>
</section>

<section id="servicios" class="seccion-plantilla">
  <div class="container">
    <h2 class="text-center mb-5">Ingrese el nombre de su pokemon o Filtro de busqueda</h2>
    <div class="row g-4 justify-content-center">
      <div class="col-md-4">
        <div class="tarjeta-plantilla w3-card-4 mb-4 ">
          <label class="form-label" for="texto">Nombre(opcional)</label>
          <input type="text" class="form-control" id="texto" placeholder="Escribe tu nombre" [(ngModel)]="nombrePokemon">


          <div class="form-field">
            <label for="exampleFormControlSelect2" class="form-label">Seleccione un filtro de busqueda rapida(opcional)</label>
            <select class="form-control" id="exampleFormControlSelect2" [(ngModel)]="filtro">
              <option>Escoge una</option>
              <option value="1">50 mas fuertes</option>
              <option value="2">Tipo Agua </option>
              <option value="3">Tipo Fuego</option>
              <option value="4">Tipo Planta</option>
              <option value="5">Tipo Electrico</option>
              <option value="6">Tipo Roca</option>
              <option value="7">Tipo Tierra</option>
              <option value="8">Tipo Normal</option>
              <option value="9">Tipo Lucha</option>
              <option value="10">Tipo Siniestro</option>
              <option value="11">Tipo Acero</option>
              <option value="12">Tipo Psíquico</option>
              <option value="13">Tipo Fantasma</option>
              <option value="14">Tipo Bicho</option>
              <option value="15">Tipo Veneno</option>
              <option value="16">Tipo Volador</option>
              <option value="17">Tipo Hada</option>
              <option value="18">Tipo Hielo</option>
              <option value="19">Tipo Dragón</option>
            </select>
          </div>
          <button type="button" class="btn-solid theme-success d-block mx-auto mt-3" (click)="enviardatos()">LISTOOOOO</button>
        </div>
      </div>
    </div>
  </div>
</section>
<section id="nosotros" class="seccion-plantilla bg-white">
  <div class="container">
    <div class="mb-3">
      <label class="form-label fw-bold">Respuesta:</label>
      <input type="text" readonly class="form-control-plaintext border rounded px-3 bg-light" [value]="">
    </div>
    </div>
</section>
