<section class="hero-plantilla">
  <div class="container">
    <h1 class="display-4">Busqueda de Pokemones </h1>
    <p class="lead">Ingresa el nombre de el pokemon y obten sus caracteristicas.</p>
    <img src="https://logos-world.net/wp-content/uploads/2020/05/Pokemon-Symbol.jpg" style="width: 600px; height: 300px"
         alt="iamgen puchamon">
  </div>
</section>

<section id="servicios" class="seccion-plantilla">
  <div class="container">
    <h2 class="text-center mb-5">Ingrese el nombre de su pokemon</h2>
    <div class="row g-4 justify-content-center">
      <div class="col-md-4">
        <div class="tarjeta-plantilla w3-card-4 mb-4 ">
          <label class="form-label" for="texto">Nombre</label>
          <input type="text" class="form-control" id="texto" placeholder="Escribe tu nombre">
          <button type="button" class="btn-solid theme-success d-block mx-auto mt-3">LISTOOOOO</button>
        </div>
      </div>
    </div>
  </div>
</section>
<section id="nosotros" class="seccion-plantilla bg-white">
  <div class="container">
    <div class="mb-3">
      <label class="form-label fw-bold">Respuesta:</label>
      <input type="text" readonly class="form-control-plaintext border rounded px-3 bg-light" [value]="">
    </div>
    </div>
</section>
