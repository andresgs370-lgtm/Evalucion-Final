<section class="hero-plantilla">
  <div class="container">
    <h1 class="display-4">Iniciar seccion </h1>
    <p class="lead">Ingresa la informacion que se le solicita.</p>
  </div>
</section>

<section id="servicios" class="seccion-plantilla">
  <div class="container">
    <h2 class="text-center mb-5">Ingrese correo previamente registrado </h2>
    <div class="row g-4 justify-content-center">
      <div class="col-md-4">
        <div class="tarjeta-plantilla w3-card-4 mb-4 ">
          <label class="form-label" for="texto">Correo</label>
          <input type="text" class="form-control" id="texto" placeholder="ejemplo@gmail.com">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-group">
            <input [type]="mostrarPassword ? 'text' : 'password'" class="form-control" id="password" placeholder="Ingrese la contraseña">
            <button class="btn btn-outline-secondary" type="button" (click)="mostrarPassword = !mostrarPassword"> {{ mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña' }}
            </button>
          </div>
          <button type="button" class="btn-solid theme-success d-block mx-auto mt-3">iNGRESAR</button>
        </div>
      </div>
    </div>
  </div>
</section>
<section id="nosotros" class="seccion-plantilla bg-white">
  <div class="container">
  </div>
</section>
